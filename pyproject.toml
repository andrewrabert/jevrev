[project]
name = "jevrev"
version = "0.1.0"
description = "Run jev over a directory or a GitHub pull request, judge its findings, and print the review or post it on the pull request"
requires-python = ">=3.14"
dependencies = [
  "httpx2>=2.16",
  "minijinja>=3.1,<4",
  "pathspec>=1.1,<2",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",
  "pygit2>=1.21",
  "python-dotenv>=1.2,<2",
  "pyyaml>=6,<7",
  "rich>=14,<15",
  "tree-sitter>=0.26,<0.27",
  "tree-sitter-bash>=0.25,<0.26",
  "tree-sitter-python>=0.25,<0.26",
  "tree-sitter-rust>=0.24,<0.25",
  "typesafe-sdk>=0.7,<0.8",
  "yarl>=1.25,<2",
]

[project.scripts]
jevrev = "jevrev.cli:cli"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv.build-backend]
module-name = "jevrev"
